<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>報名系統・管理後台</title>
<style>
:root{--bg:#f1edf6;--fg:#1f1830;--card:#fff;--ac:#b0125f;--acfg:#fff;--mut:#6f6783;--bd:#d9d1e6}
@media(prefers-color-scheme:dark){:root{--bg:#17121f;--fg:#efeaf7;--card:#221b2e;--ac:#f06aa6;--acfg:#1a0b13;--mut:#a79cbd;--bd:#3a3050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-top:16px}
label{display:block;margin-top:12px;font-weight:600}
input[type=text],input[type=password],input[type=number],select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
.full{width:100%}
.plans label{font-weight:400;margin:6px 0;display:flex;gap:8px;align-items:center}
button{font:inherit;font-weight:700;padding:9px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--acfg);cursor:pointer;margin-top:12px}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd);margin:0 6px 0 0}
button.ghost.on{border-color:var(--ac);color:var(--ac)}
button.sm{margin:0;padding:3px 10px;font-size:.9rem}
button.line{background:transparent;color:var(--ac);border:1px solid var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.msg{margin-top:10px;font-weight:600}.err{color:#d32f2f}
.code{font:800 1.8rem/1.2 ui-monospace,monospace;letter-spacing:.2em;color:var(--ac)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
td.c{font-family:ui-monospace,monospace;letter-spacing:.1em}
.mut{color:var(--mut);font-size:.9rem}.x{color:#d32f2f;font-weight:600}
tr.past td{opacity:.55}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);padding:20px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-size:1.15rem;margin:0 0 4px}
.rec{padding:10px 0;border-bottom:1px solid var(--bd)}.rec:last-of-type{border:0}
</style>
</head>
<body>
<main>
  <h1>管理後台</h1>
  <label for="pw">管理員密碼</label>
  <input id="pw" class="full" type="password" autocomplete="current-password">
  <div style="margin-top:14px">
    <button class="ghost on" data-t="create">建立會員</button><button class="ghost" data-t="manage">會員管理</button><button class="ghost" data-t="stats">日期統計與設定</button>
  </div>

  <section id="create" class="card">
    <label for="name">名字</label><input id="name" class="full" type="text">
    <label for="phone">電話（用來判斷會員是否重複）</label><input id="phone" class="full" type="text" inputmode="tel" autocomplete="off" placeholder="0912-345-678（可含橫線、空格或 +886）">
    <label for="line">Line 別名</label><input id="line" class="full" type="text">
    <label>課程選項</label>
    <div class="plans" id="plans"></div>
    <button id="make">建立會員</button>
    <p id="cmsg" class="msg"></p>
  </section>

  <section id="manage" class="card" hidden>
    <div style="margin-bottom:12px"><button class="ghost on" id="fa" data-f="0" style="margin-top:0">活躍會員</button><button class="ghost" id="fi" data-f="1" style="margin-top:0">非活躍會員</button></div>
    <p class="mut" style="margin-top:0">非活躍：堂數歸 0、沒有未來預約，且超過三個月沒有購買課程。為非活躍會員加入課程後，會自動回到活躍。</p>
    <div class="wrap"><table>
      <thead><tr><th>專屬帳號</th><th>名字</th><th>電話</th><th>Line 別名</th><th>購買課程與剩餘堂數</th><th>已預約日期</th><th>新增課程</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p id="mmsg" class="msg"></p>
  </section>

  <section id="stats" class="card" hidden>
    <label for="hours">會員自行取消時限（上課日前幾小時，0 表示上課日前都可取消）</label>
    <input id="hours" type="number" min="0" style="width:100px"> 小時 <button class="sm" id="saveHours">儲存</button>
    <p class="mut">以上課日台灣時間 00:00 為基準計算。</p>
    <button class="sm line" id="xl" style="margin-bottom:10px">匯出 Excel</button>
    <div class="wrap"><table>
      <thead><tr><th>日期</th><th>報名人數</th><th>名單</th><th>狀態</th><th></th></tr></thead>
      <tbody id="srows"></tbody>
    </table></div>
    <p id="smsg" class="msg"></p>
  </section>
</main>
<dialog id="dlg">
  <h2 id="dt"></h2>
  <p class="mut" id="ds"></p>
  <div id="db"></div>
  <button id="dx">關閉</button>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API = 'https://dance-signup.where330.workers.dev'; // ← 你的 Worker 網址
const PLANS = { single: '單堂課程', fri4: '四堂週五優惠課程', sun4: '四堂週日優惠課程', fri8: '八堂週五優惠課程', sun8: '八堂週日優惠課程' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (d) => `${d.slice(0, 4)}/${+d.slice(5, 7)}/${+d.slice(8)}（週${'日一二三四五六'[new Date(d + 'T00:00:00').getDay()]}）`;
const fmtPhone = (d) => (/^09\d{8}$/.test(d) ? d.replace(/(\d{4})(\d{3})(\d{3})/, '$1-$2-$3') : d);
const ymd = (d) => `${d.slice(0, 4)}/${+d.slice(5, 7)}/${+d.slice(8)}`;
const sum = (m) => Object.entries(m.packs.filter((p) => !p.revoked).reduce((o, p) => ((o[p.label] = (o[p.label] || 0) + 1), o), {})).map(([k, v]) => `${k}×${v}`).join('、');
const opts = Object.entries(PLANS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
let MEMBERS = [], STATS = [], SHOWINACTIVE = false;
$('pw').value = sessionStorage.getItem('pw') || '';
$('plans').innerHTML = Object.entries(PLANS).map(([k, v], i) => `<label><input type="radio" name="plan" value="${k}" ${i ? '' : 'checked'}>${v}</label>`).join('');

async function call(body) {
  sessionStorage.setItem('pw', $('pw').value);
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ ...body, password: $('pw').value }) });
    return await r.json();
  } catch { return { ok: false, error: '連線失敗，請稍後再試' }; }
}
function tab(n) {
  ['create', 'manage', 'stats'].forEach((t) => $(t).hidden = t !== n);
  document.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === n));
  if (n !== 'create') load(n);
}
document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => tab(b.dataset.t));

$('make').onclick = async () => {
  const m = $('cmsg'); m.className = 'msg'; m.textContent = '建立中…';
  const res = await call({ action: 'admin_create', name: $('name').value, phone: $('phone').value, line: $('line').value, plan: document.querySelector('input[name=plan]:checked').value });
  if (!res.ok) { m.className = 'msg err'; m.textContent = res.error; return; }
  m.innerHTML = `已建立 ${esc($('name').value)}，專屬帳號：<div class="code">${res.code}</div><button class="sm line" data-copy="${res.code}" style="margin:6px 0">一鍵複製帳號</button><br><span class="mut">請把這組帳號傳給會員。</span>`;
  $('name').value = ''; $('phone').value = ''; $('line').value = '';
};

async function load(n) {
  const msg = n === 'manage' ? $('mmsg') : $('smsg');
  msg.className = 'msg'; msg.textContent = '載入中…';
  const res = await call({ action: 'admin_list' });
  if (!res.ok) { msg.className = 'msg err'; msg.textContent = res.error; return; }
  msg.textContent = '';
  if (n === 'manage') {
    MEMBERS = res.members;
    $('fa').textContent = `活躍會員（${res.members.filter((m) => !m.inactive).length}）`;
    $('fi').textContent = `非活躍會員（${res.members.filter((m) => m.inactive).length}）`;
    $('fa').classList.toggle('on', !SHOWINACTIVE); $('fi').classList.toggle('on', SHOWINACTIVE);
    $('rows').innerHTML = res.members.filter((m) => !!m.inactive === SHOWINACTIVE).map((m) => `<tr>
      <td class="c">${esc(m.code)}<br><button class="sm line" data-copy="${esc(m.code)}" style="margin-top:4px">複製</button></td><td>${esc(m.name)}</td><td>${esc(m.phone ? fmtPhone(m.phone) : '—')}</td><td>${esc(m.line)}</td>
      <td><b>購買統計：</b>${esc(sum(m))}<br><b>合計剩 ${m.remaining} 堂</b><br><button class="sm line" data-log="${m.code}">購買紀錄</button></td>
      <td>${m.booked.length ? `${m.booked.length} 堂<br><button class="sm line" data-book="${m.code}">查看日期</button>` : '—'}</td>
      <td><select data-s="${m.code}">${opts}</select><br><button class="sm line" data-add="${m.code}">加入課程</button></td></tr>`).join('') || `<tr><td colspan="7">${SHOWINACTIVE ? '沒有非活躍會員。' : '沒有活躍會員。'}</td></tr>`;
  } else {
    STATS = res.stats;
    $('hours').value = res.settings.cancelHours;
    $('srows').innerHTML = res.stats.map((s) => `<tr class="${s.past ? 'past' : ''}">
      <td>${fmt(s.date)}</td><td>${s.count}</td><td>${s.names.map(esc).join('、') || '—'}</td>
      <td>${s.cancelled ? '<span class="x">已取消</span>' : s.past ? '已結束' : '正常'}</td>
      <td>${!s.cancelled && !s.past ? `<button class="sm line" data-cx="${s.date}" data-n="${s.count}">取消這天</button>` : ''}</td></tr>`).join('');
  }
}
const dlg = $('dlg');
$('dx').onclick = () => dlg.close();
dlg.addEventListener('click', async (e) => {
  if (e.target === dlg) { dlg.close(); return; }
  const d = e.target.dataset;
  if (!d.rv) return;
  const note = +d.u ? `這份課程已預約的 ${d.u} 堂會一併取消。` : '這份課程目前沒有預約。';
  if (!confirm(`確定回收「${d.l}」？${note}回收後會員將無法再使用這份課程。`)) return;
  const res = await call({ action: 'admin_revoke_pack', code: d.c, packId: d.rv });
  if (!res.ok) { alert(res.error); return; }
  dlg.close(); load('manage');
});
$('manage').onclick = async (e) => {
  const f = e.target.dataset.f;
  if (f) { SHOWINACTIVE = f === '1'; load('manage'); return; }
  const lg = e.target.dataset.log;
  if (lg) {
    const m = MEMBERS.find((x) => x.code === lg);
    $('dt').textContent = `${m.name} 的購買紀錄`;
    $('ds').textContent = `帳號 ${m.code}｜合計剩 ${m.remaining} 堂`;
    $('db').innerHTML = m.packs.map((p) => p.revoked
      ? `<div class="rec" style="opacity:.55"><b>${esc(p.label)}</b> <span class="x">已回收</span><br><span class="mut">${ymd(p.date)} 購買</span></div>`
      : `<div class="rec"><b>${esc(p.label)}</b><br><span class="mut">${ymd(p.date)} 購買｜已用 ${p.total - p.remaining}／${p.total} 堂，剩 ${p.remaining} 堂</span><br><button class="sm line" style="margin-top:6px" data-rv="${p.id}" data-c="${m.code}" data-u="${p.total - p.remaining}" data-l="${esc(p.label)}">回收這份課程</button></div>`).join('');
    dlg.showModal();
    return;
  }
  const bk = e.target.dataset.book;
  if (bk) {
    const m = MEMBERS.find((x) => x.code === bk);
    $('dt').textContent = `${m.name} 的已預約日期`;
    $('ds').textContent = `帳號 ${m.code}｜共 ${m.booked.length} 堂`;
    $('db').innerHTML = m.booked.map((d) => `<div class="rec">${fmt(d)}</div>`).join('');
    dlg.showModal();
    return;
  }
  const code = e.target.dataset.add; if (!code) return;
  const plan = document.querySelector(`select[data-s="${code}"]`).value;
  if (!confirm(`為 ${code} 加入「${PLANS[plan]}」？`)) return;
  const res = await call({ action: 'admin_add_pack', code, plan });
  if (!res.ok) { $('mmsg').className = 'msg err'; $('mmsg').textContent = res.error; return; }
  load('manage');
};
$('stats').onclick = async (e) => {
  const d = e.target.dataset.cx; if (!d) return;
  if (!confirm(`確定取消 ${fmt(d)} 的課？已報名的 ${e.target.dataset.n} 位會員會自動退回堂數。`)) return;
  const res = await call({ action: 'admin_cancel_date', date: d });
  if (!res.ok) { $('smsg').className = 'msg err'; $('smsg').textContent = res.error; return; }
  load('stats');
};
$('saveHours').onclick = async () => {
  const res = await call({ action: 'admin_set_hours', hours: $('hours').value });
  $('smsg').className = 'msg' + (res.ok ? '' : ' err'); $('smsg').textContent = res.ok ? '已儲存' : res.error;
};
$('phone').addEventListener('blur', () => {
  let v = $('phone').value.replace(/\D/g, '');
  if (!v) return;
  if (v.startsWith('886')) v = '0' + v.slice(3).replace(/^0/, '');
  if (/^9\d{8}$/.test(v)) v = '0' + v;
  $('phone').value = fmtPhone(v);
});
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const t = b.dataset.copy;
  try { await navigator.clipboard.writeText(t); }
  catch { const x = document.createElement('textarea'); x.value = t; document.body.append(x); x.select(); document.execCommand('copy'); x.remove(); }
  const old = b.textContent; b.textContent = '已複製 ✓';
  setTimeout(() => { b.textContent = old; }, 1500);
});
$('xl').onclick = () => {
  if (!STATS.length) { alert('目前沒有資料可匯出'); return; }
  const rows = STATS.map((s) => ({
    '日期': ymd(s.date),
    '星期': '週' + '日一二三四五六'[new Date(s.date + 'T00:00:00').getDay()],
    '報名人數': s.count,
    '報名名單': s.names.join('、'),
    '狀態': s.cancelled ? '已取消' : s.past ? '已結束' : '正常',
  }));
  const name = `日期統計_${new Date().toLocaleDateString('sv')}`;
  if (window.XLSX) {
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, { wch: 6 }, { wch: 10 }, { wch: 40 }, { wch: 8 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '日期統計');
    XLSX.writeFile(wb, name + '.xlsx');
  } else { // 函式庫載入失敗時改匯出 CSV（Excel 可直接開啟）
    const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const csv = '\ufeff' + [Object.keys(rows[0]), ...rows.map((r) => Object.values(r))].map((r) => r.map(q).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = name + '.csv'; a.click();
  }
};
</script>
</body>
</html>
