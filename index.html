<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>舞蹈課程報名</title>
<style>
:root{--bg:#f1edf6;--fg:#1f1830;--card:#fff;--ac:#b0125f;--acfg:#fff;--mut:#6f6783;--bd:#d9d1e6}
@media(prefers-color-scheme:dark){:root{--bg:#17121f;--fg:#efeaf7;--card:#221b2e;--ac:#f06aa6;--acfg:#1a0b13;--mut:#a79cbd;--bd:#3a3050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Noto Sans TC",system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.04em}
p{margin:.3rem 0}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-top:18px}
input[type=text]{width:100%;font:inherit;font-size:1.4rem;letter-spacing:.25em;text-transform:uppercase;text-align:center;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;font-weight:700;width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--acfg);cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.left{font-size:2.6rem;font-weight:800;line-height:1;color:var(--ac)}
#dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#dates label{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
#dates label:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
#dates label:has(input:disabled){opacity:.4;cursor:not-allowed}
#dates input{width:18px;height:18px;accent-color:var(--ac)}
.msg{margin-top:12px;font-weight:600}.err{color:#d32f2f}.ok{color:#2e7d32}
</style>
</head>
<body>
<main>
  <h1>舞蹈課程報名</h1>
  <p class="mut">輸入老師給你的 8 碼專屬帳號。</p>

  <section id="login" class="card">
    <input id="code" type="text" maxlength="8" autocomplete="off" aria-label="專屬帳號">
    <button id="loginBtn">登入</button>
    <p id="loginMsg" class="msg err"></p>
  </section>

  <section id="app" hidden>
    <div class="card">
      <p id="who" class="mut"></p>
      <p><span class="left" id="left"></span> 堂可預約</p>
      <p class="mut">已預約：<span id="booked"></span></p>
    </div>
    <div class="card">
      <p><b>選擇上課日期</b>（已選 <span id="sel">0</span> 堂）</p>
      <p class="mut" id="hint"></p>
      <div id="dates"></div>
      <button id="go" disabled>送出預約</button>
      <p id="msg" class="msg"></p>
    </div>
  </section>
</main>
<script>
const API = 'https://dance-signup.where330.workers.dev/'; // ← 換成你的 Worker 網址
const $ = (id) => document.getElementById(id);
let code = '', info = null;

const fmt = (d) => `${+d.slice(5, 7)}/${+d.slice(8)}（${'日一二三四五六'[new Date(d + 'T00:00:00').getDay()]}）`;
async function call(body) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
    return await r.json();
  } catch { return { ok: false, error: '連線失敗，請稍後再試' }; }
}

$('loginBtn').onclick = async () => {
  code = $('code').value.trim().toUpperCase();
  $('loginMsg').textContent = '';
  if (code.length !== 8) { $('loginMsg').textContent = '請輸入 8 碼帳號'; return; }
  const res = await call({ action: 'login', code });
  if (!res.ok) { $('loginMsg').textContent = res.error; return; }
  info = res.info; $('login').hidden = true; $('app').hidden = false; render();
};
//$('code').onkeydown = (e) => e.key === 'Enter' && $('loginBtn').click();

function render() {
  $('who').textContent = `${info.name}｜${info.plan}`;
  $('left').textContent = info.remaining;
  $('booked').textContent = info.booked.length ? info.booked.map(fmt).join('、') : '尚無';
  $('hint').textContent = info.remaining ? '可以只選一部分，剩下的堂數之後再來選。' : '堂數已用完，如需續課請聯絡老師。';
  const box = $('dates'); box.innerHTML = '';
  info.options.forEach((d) => {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" value="${d}"><span>${fmt(d)}</span>`;
    box.append(l);
  });
  box.onchange = update; update();
}
function update() {
  const cs = [...document.querySelectorAll('#dates input')];
  const n = cs.filter((c) => c.checked).length;
  cs.forEach((c) => (c.disabled = !c.checked && n >= info.remaining));
  $('sel').textContent = n; $('go').disabled = n === 0;
}
$('go').onclick = async () => {
  const dates = [...document.querySelectorAll('#dates input:checked')].map((c) => c.value);
  $('go').disabled = true; $('msg').textContent = '送出中…'; $('msg').className = 'msg';
  const res = await call({ action: 'book', code, dates });
  if (!res.ok) { $('msg').textContent = res.error; $('msg').className = 'msg err'; update(); return; }
  info = res.info; render();
  $('msg').textContent = `已預約 ${dates.length} 堂`; $('msg').className = 'msg ok';
};
</script>
</body>
</html>
